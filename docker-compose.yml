version: '3.9'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://medivault:medivault@db:5432/medivault
      - SECRET_KEY=local-dev-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALLOWED_ORIGINS=["http://localhost:5173"]
      - SUPABASE_URL=https://placeholder.supabase.co
      - SUPABASE_ANON_KEY=placeholder
      - SUPABASE_SERVICE_KEY=placeholder
      - STORAGE_BUCKET=medivault
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: medivault
      POSTGRES_PASSWORD: medivault
      POSTGRES_DB: medivault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medivault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
